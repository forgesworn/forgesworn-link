[package]
name = "link-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# The paired-route engine behind link-ffi and link-web: route checks, pairing
# enrolment, the bounded JSON request and the event socket, written once and
# runtime-neutral.

[dependencies]
link-core = { path = "../link-core" }
link-endpoint = { path = "../link-endpoint" }
link-websocket = { path = "../link-websocket" }
bytes.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio.workspace = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util"] }

[dev-dependencies]
tokio.workspace = true
link-relay = { path = "../link-relay" }
rustls.workspace = true
tokio-tungstenite.workspace = true
