[package]
name = "link-endpoint"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
link-core = { path = "../link-core" }
anyhow.workspace = true
futures-io = "0.3"
futures-util.workspace = true
rand.workspace = true
rustls.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

# Native: tokio's runtime, a real UDP socket, interface polling, and the
# relay dialled over TCP with tokio-rustls.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
if-addrs.workspace = true
quinn.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite.workspace = true
webpki-roots.workspace = true

# Browser (`wasm_browser`): relay-only over the page's WebSocket.  tokio
# keeps only its portable parts; the page's event loop and timers stand in
# for its runtime.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
quinn = { version = "0.11", default-features = false, features = ["rustls-ring"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasmtimer = { version = "0.4", default-features = false, features = ["tokio"] }
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "Event", "MessageEvent", "WebSocket"] }
web-time = "1"

[dev-dependencies]
link-relay = { path = "../link-relay" }
libc.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
