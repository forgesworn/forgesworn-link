[package]
name = "link-paired-files"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
link-core = { git = "https://github.com/forgesworn/forgesworn-link.git", rev = "09fa9ae7e80840e5713da9b2d7b6e66d6a0f0165" }
link-endpoint = { git = "https://github.com/forgesworn/forgesworn-link.git", rev = "09fa9ae7e80840e5713da9b2d7b6e66d6a0f0165" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "time"] }
zeroize = "1"
