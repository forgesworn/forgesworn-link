[workspace]
resolver = "3"
members = [
    "crates/link-core",
    "crates/link-relay",
    "crates/link-endpoint",
    "crates/link-spike",
    "crates/link-blossom",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ForgeSworn"]
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
if-addrs = "0.15"
hkdf = "0.12"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic", "std"] }
libc = "0.2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shelter-kit = { git = "https://github.com/forgesworn/shelter-kit", tag = "v0.4.1" }
thiserror = "2"
url = "2"
webpki-roots = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
