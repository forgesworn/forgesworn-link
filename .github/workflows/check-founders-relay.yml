name: Check public founders' relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trusted TLS and WebSocket upgrade
        run: python3 deploy/founders/verify-endpoint.py
      - name: Public UDP reflector round trip
        run: python3 deploy/founders/verify-reflector.py
