name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify bounded uploads and failed-start rollback
        run: python3 -m unittest discover -s deploy/founders -p 'test_*.py' -v
      - name: Validate the service unit before deployment
        run: |
          set -euo pipefail
          sed 's@ExecStart=/opt/link-relay/current/link-relay @ExecStart=/bin/true @' \
            deploy/founders/link-relay.service > "$RUNNER_TEMP/link-relay.service"
          systemd-analyze verify "$RUNNER_TEMP/link-relay.service"

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
