[package]
name = "iroh-recovery"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
default-run = "iroh-recovery"

[workspace]

[dependencies]
anyhow = "1"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server", "tls-ring"] }
link-endpoint = { path = "../../crates/link-endpoint" }
link-relay = { path = "../../crates/link-relay" }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time", "net"] }
zeroize = "1"
